<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="Mobilis — exercices de réadaptation musculo-squelettique guidés par caméra et coach vocal.">
  <title>Mobilis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Téléphone : toujours la mise en page mobile, même si Chrome affiche le « site pour ordinateur ».
    (function () {
      var d = document.documentElement;
      function fit() {
        var touch = matchMedia('(pointer: coarse)').matches && !matchMedia('(hover: hover)').matches;
        var sw = Math.min(screen.width, screen.height), w = window.innerWidth;
        var phone = touch && sw < 700;
        var z = phone && w > screen.width * 1.25 ? w / screen.width : 1;
        d.style.zoom = z === 1 ? '' : String(z);
        d.classList.toggle('wide', !phone && w >= 900);
      }
      fit(); window.addEventListener('resize', fit);
    })();
  </script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
